name: Release

on:
  push:
    tags:
      - 'V*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: x64, runner: windows-latest }
          - { os: linux,   arch: x64, runner: ubuntu-latest }
          - { os: macos,   arch: x64, runner: macos-13     }
          - { os: macos,   arch: arm64, runner: macos-14   }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Inject version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#V}" >> $GITHUB_ENV

      - name: Replace source version
        shell: bash
        run: |
          sed -i.bak 's/VERSION = ".*"/VERSION = "${{ env.VERSION }}"/' src/main/java/com/sojourners/chess/App.java
          rm -f src/main/java/com/sojourners/chess/App.java.bak

      - name: Build jar and staging
        shell: bash
        run: |
          mvn -B package -DskipTests
          mvn -B dependency:copy-dependencies -DoutputDirectory=target/deps -DincludeScope=runtime
          mkdir -p target/staging
          cp target/deps/* target/staging/
          cp target/Xiangqi-*.jar target/staging/
          cp -r src/main/resources/model src/main/resources/sound src/main/resources/ui src/main/resources/font target/staging/
          echo "JAR_NAME=$(ls target/Xiangqi-*.jar | xargs basename)" >> $GITHUB_ENV
          echo "JPACKAGE_VERSION=$(echo '${{ env.VERSION }}' | cut -d- -f1)" >> $GITHUB_ENV

      - name: Build app-image (Windows/Linux)
        if: matrix.os != 'macos'
        shell: bash
        run: |
          jpackage --type app-image --name TCHESS --input target/staging \
            --main-jar ${{ env.JAR_NAME }} --main-class com.sojourners.chess.Main \
            --app-version ${{ env.JPACKAGE_VERSION }} --dest target/dist

      - name: Build dmg (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          jpackage --type dmg --name TCHESS --input target/staging \
            --main-jar ${{ env.JAR_NAME }} --main-class com.sojourners.chess.Main \
            --app-version ${{ env.JPACKAGE_VERSION }} --dest target/dist
          mv target/dist/*.dmg "tchess_V${{ env.VERSION }}_macos_${{ matrix.arch }}.dmg"

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: 7z a "tchess_V${{ env.VERSION }}_windows_x64.7z" target/dist/TCHESS

      - name: Package (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: tar -czf "tchess_V${{ env.VERSION }}_linux_x64.tar.gz" -C target/dist TCHESS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tchess_V${{ env.VERSION }}_${{ matrix.os }}_${{ matrix.arch }}
          path: tchess_V*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: artifacts/*/*
