name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

jobs:
  commit-lint:
    # IT-1.5: conventional commits 规范校验（仅校验本次新增提交，不追溯历史提交）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="$PR_BASE_SHA..HEAD"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="$BEFORE_SHA..HEAD"
          fi
          REGEX='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_./-]+\))?!?: .+'
          FAIL=0
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            [[ "$msg" == Merge\ * ]] && continue
            if ! [[ "$msg" =~ $REGEX ]]; then
              echo "不符合规范: $msg"
              FAIL=1
            fi
          done < <(git log --format=%s "$RANGE")
          exit $FAIL

  build:
    # IT-1.1: 三平台矩阵构建，验证标准为 mvn verify（当前无测试即 compile+package，测试引入后自动生效）
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B verify --file pom.xml
